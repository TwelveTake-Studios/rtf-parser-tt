<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="author" content="TwelveTake Studios"><title>Formatting</title></head>
<body>
<p>Plain, <b>bold</b>, <i>italic</i>, <u>underlined</u>, <s>struck</s>, <b><i>bold italic</i></b>.</p>
<p>Water is H<sub>2</sub>O and E equals mc<sup>2</sup>.</p>
<p><span style="font-variant:small-caps">Small capitals</span> and <span style="color:#c00000">red text</span> and <span style="background-color:yellow">highlighted text</span>.</p>
<p><span style="font-size:8pt">Small</span>, <span style="font-size:12pt">normal</span>, <span style="font-size:24pt">large</span>.</p>
<p><span style="font-family:'Courier New'">Monospaced text</span> and <span style="font-family:Arial">sans-serif text</span>.</p>
<p>Bold across words: <b>one two</b> <b>three</b>.</p>
</body></html>
